# Opens holes in default-deny-egress for the client: podinfo and DNS only.
# Everything else (including the internet) stays blocked.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-client
spec:
  podSelector:
    matchLabels:
      app: client
  policyTypes:
    - Egress
  egress:
    # podinfo in backend. The client calls the Service IP; Cilium evaluates the
    # policy against the backend pod after service translation, so pod selectors work.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backend
          podSelector:
            matchLabels:
              app: podinfo
      ports:
        - protocol: TCP
          port: 9898
    # CoreDNS, needed to resolve podinfo.backend.svc.cluster.local. TCP is used
    # for large responses that do not fit into UDP.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
